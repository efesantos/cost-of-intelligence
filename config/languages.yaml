# Language set for the fertility engine (Stream B, Task B-1 / B-4).
# Codes are FLORES-200 (ISO 639-3 + script). English is the reference (fertility=1).
#
# `launch` = the paper's headline set (Lusophone + Hispanophone + a European control).
# `extension` = African / Global-South breadth, added at near-zero marginal cost.
# The harness takes this list as config, so adding a FLORES language is one line.
#
# NOTE (B-1 caveat, binding): FLORES-200 `por_Latn` is a SINGLE Portuguese row and
# its variant provenance is not guaranteed to be European vs Brazilian. Variant-level
# (pt-PT / pt-BR / pt-AO) claims rest ONLY on the Stream A validated 4-arm corpus
# (Task B-8), never on this FLORES row. Recorded in docs/flores_variant_note.md.

reference: eng_Latn

launch:
  - eng_Latn   # English (reference)
  - por_Latn   # Portuguese (variant-ambiguous; see note)
  - spa_Latn   # Spanish
  - fra_Latn   # French (high-resource European control)

extension:
  - swh_Latn   # Swahili
  - hau_Latn   # Hausa
  - yor_Latn   # Yoruba
  - zul_Latn   # Zulu
  - amh_Ethi   # Amharic (Ge'ez script — expected high fertility)
  - arb_Arab   # Arabic
  - hin_Deva   # Hindi (Devanagari)
  - zho_Hans   # Chinese (Simplified — logographic)

# Panel-widening set (Task: widen adoption regression to N>=15 countries). Each
# maps to a distinct country with likely AEI + World Bank coverage. Any code not
# present in FLORES-200 is skipped gracefully by corpus.py and logged.
panel:
  - ind_Latn   # Indonesian -> Indonesia
  - vie_Latn   # Vietnamese -> Vietnam
  - tha_Thai   # Thai -> Thailand
  - tur_Latn   # Turkish -> Turkey
  - rus_Cyrl   # Russian -> Russia
  - deu_Latn   # German -> Germany
  - ita_Latn   # Italian -> Italy
  - pol_Latn   # Polish -> Poland
  - jpn_Jpan   # Japanese -> Japan
  - kor_Hang   # Korean -> South Korea
  - ben_Beng   # Bengali -> Bangladesh
  - tgl_Latn   # Tagalog -> Philippines
  - ukr_Cyrl   # Ukrainian -> Ukraine
  - ron_Latn   # Romanian -> Romania
  - ell_Grek   # Greek -> Greece
  - pes_Arab   # Persian -> Iran

# Human-readable names for reports/figures.
names:
  eng_Latn: English
  por_Latn: Portuguese
  spa_Latn: Spanish
  fra_Latn: French
  swh_Latn: Swahili
  hau_Latn: Hausa
  yor_Latn: Yoruba
  zul_Latn: Zulu
  amh_Ethi: Amharic
  arb_Arab: Arabic
  hin_Deva: Hindi
  zho_Hans: Chinese (Simp.)
  ind_Latn: Indonesian
  vie_Latn: Vietnamese
  tha_Thai: Thai
  tur_Latn: Turkish
  rus_Cyrl: Russian
  deu_Latn: German
