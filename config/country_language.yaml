# Country <-> language mapping (Stream B, Task B-4).
# Each language maps to a PRIMARY analysis country (ISO3) + alternates for the
# sensitivity axis. Wage/FX/PPP data is keyed on the primary country.
#
# `country_effective_fertility` for the B-7 country-level regression = fertility
# of the country's dominant language(s), weighted by cited speaker shares where
# multiple. [INFERENCE] dominant-language weighting is a modeling choice, also
# sensitivity-tested with an unweighted primary-language-only variant.

languages:
  eng_Latn:
    primary: USA
    alternates: [GBR, NGA]
    note: "English as the reference; US wage is the numeraire anchor."
  por_Latn:
    primary: PRT          # FLORES por_Latn used only for launch fertility; variant claims use Stream A corpus
    alternates: [BRA, AGO, MOZ]
  spa_Latn:
    primary: MEX
    alternates: [COL, ESP]
  fra_Latn:
    primary: FRA
    alternates: [SEN, CIV]
  swh_Latn:
    primary: KEN
    alternates: [TZA]
  hau_Latn:
    primary: NGA
    alternates: [NER]
  yor_Latn:
    primary: NGA
    alternates: []
  zul_Latn:
    primary: ZAF
    alternates: []
  amh_Ethi:
    primary: ETH
    alternates: []
  arb_Arab:
    primary: EGY
    alternates: [MAR, SAU]
  hin_Deva:
    primary: IND
    alternates: []
  zho_Hans:
    primary: CHN
    alternates: []
  # panel-widening languages -> distinct countries (Task: N>=15 regression)
  ind_Latn: {primary: IDN, alternates: []}
  vie_Latn: {primary: VNM, alternates: []}
  tha_Thai: {primary: THA, alternates: []}
  tur_Latn: {primary: TUR, alternates: []}
  rus_Cyrl: {primary: RUS, alternates: []}
  deu_Latn: {primary: DEU, alternates: [AUT]}
  ita_Latn: {primary: ITA, alternates: []}
  pol_Latn: {primary: POL, alternates: []}
  jpn_Jpan: {primary: JPN, alternates: []}
  kor_Hang: {primary: KOR, alternates: []}
  ben_Beng: {primary: BGD, alternates: []}
  tgl_Latn: {primary: PHL, alternates: []}
  ukr_Cyrl: {primary: UKR, alternates: []}
  ron_Latn: {primary: ROU, alternates: []}
  ell_Grek: {primary: GRC, alternates: []}
  pes_Arab: {primary: IRN, alternates: []}

# Variant sub-study territories (Task B-8): each pairs a Portuguese variant to a
# territory using that territory's OWN variant fertility (from Stream A corpus,
# not FLORES). Speaker/variant sources to be cited in the datasheet.
lusophone_territories:
  pt-PT: PRT
  pt-BR: BRA
  pt-AO: AGO
  pt-MZ: MOZ

